name: Draft PDF
# Archived: this built the JOSS paper for v1.1.1 (see paper/README.md).
# It no longer runs on push; it only runs if started by hand from the Actions tab.
# A manual run only uploads the rebuilt PDF as a workflow artifact; it never
# commits it, so paper/paper.pdf stays the published v1.1.1 copy.
on:
  workflow_dispatch:

jobs:
  paper:
    runs-on: ubuntu-latest
    name: Paper Draft
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build draft PDF
        uses: openjournals/openjournals-draft-action@master
        with:
          journal: joss
          # This should be the path to the paper within your repo.
          paper-path: paper/paper.md
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: paper
          # This is the output path where Pandoc will write the compiled
          # PDF. Note, this should be the same directory as the input
          # paper.md
          path: paper/paper.pdf
      # Disabled so the published v1.1.1 PDF is never overwritten.
      # - name: Commit PDF to repository
      #   uses: EndBug/add-and-commit@v9
      #   with:
      #     message: '(auto) Paper PDF Draft'
      #     # This should be the path to the paper within your repo.
      #     add: 'paper/paper.pdf' # 'paper/*.pdf' to commit all PDFs in the paper directory
